# Configuració per publicar una versió de prova gratuïta a Render (https://render.com).
# Cada vegada que el servei arrenca es tornen a crear les dades de demostració.
services:
  - type: web
    name: colla-castellera-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run demo
    healthCheckPath: /api/health
    # Només es publica una versió nova quan la CI de GitHub (lint, proves i proves al navegador) ha passat.
    autoDeployTrigger: checksPass
    envVars:
      - key: COLLA_NAME
        value: Colla de prova
